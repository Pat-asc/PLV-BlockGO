---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: blockgo-frontend-config
  namespace: plv-fabric
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT

---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: blockgo-forwarded-headers
  namespace: plv-fabric
spec:
  # The classic GCE load balancer applies this timeout to the full lifetime of
  # upgraded WebSocket connections. Keep Grafana Live sessions stable while
  # retaining a finite upper bound for all requests through the API gateway.
  timeoutSec: 3600
  customRequestHeaders:
    headers:
      # GCP derives this value from the transport connection and replaces any
      # client-supplied X-Forwarded-For chain before the request reaches a pod.
      - "X-Forwarded-For:{client_ip_address}"
      # FrontendConfig redirects public HTTP before it reaches these backends.
      - "X-Forwarded-Proto:https"

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: plv-fabric
  annotations:
    kubernetes.io/ingress.class: "gce"

    # Permanent GCP production IP
    kubernetes.io/ingress.global-static-ip-name: "blockgo-prod-ip"

    # Redirect HTTP -> HTTPS
    networking.gke.io/v1beta1.FrontendConfig: "blockgo-frontend-config"

spec:
  tls:
  - hosts:
    - __BLOCKGO_PUBLIC_HOST__
    secretName: __BLOCKGO_PUBLIC_TLS_SECRET__
  rules:
  - host: __BLOCKGO_PUBLIC_HOST__
    http:
      paths:

      - path: /api/Auth
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      - path: /api/password-reset-requests
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      - path: /api/Grades
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      - path: /api/Student
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      - path: /api/student
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      - path: /api/GradeTemplate
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      - path: /api/SystemSettings
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      - path: /api/SystemMonitoring
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      - path: /api/BulkUpload
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      # Compatibility aliases implemented as absolute ASP.NET routes.
      - path: /api/bulk-faculty-load
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      - path: /api/bulk-faculty-sections
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      - path: /api/assign-faculty-bulk
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      - path: /api/chairperson
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      - path: /api/RegistrarDashboard
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      - path: /api/Sectioning
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      - path: /api/AccountManagement
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      - path: /api/Curriculums
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      - path: /api/SupportTickets
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      - path: /api/Transcript
        pathType: Prefix
