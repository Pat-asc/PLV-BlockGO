            name: ipfs-ha-gateway
            port:
              number: 8080

      # Auto-synchronized ASP.NET API routes.
      - path: /api/bulk-faculty-load-chairperson
        pathType: Prefix
        backend:
          service:
            name: client-app-service
            port:
              number: 5000

      - path: /api/bulk-faculty-sections-upload
        pathType: Prefix
