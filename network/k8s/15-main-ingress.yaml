            name: client-app-service
            port:
              number: 5000

      - path: /api
        pathType: Prefix
        backend:
          service:
            name: middleware-api
            port:
              number: 4000

      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
