---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: firewall-main-dbs
  namespace: plv-main-campus
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [couchdb-registrar, couchdb-wallet-registrar, postgres-primary]
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: peer-registrar
    ports:
    - protocol: TCP
      port: 5984
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: plv-fabric
      podSelector:
        matchExpressions:
          - key: app
            operator: In
            values: [auth-service, settings-service, fabric-identity-service, ledger-service, client-app, plv-client-app]
    ports:
    - protocol: TCP
      port: 5984
    - protocol: TCP
      port: 5432
  # Every ASP.NET workload validates authenticated users against the primary
  # database. Keep this separate from the CouchDB rule above so these services
  # receive PostgreSQL access only.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: plv-fabric
      podSelector:
        matchExpressions:
          - key: app
            operator: In
            values:
              - dotnet-api-gateway
              - dotnet-auth-service
              - dotnet-academic-service
              - dotnet-grade-service
              - dotnet-operations-service
              - dotnet-realtime-service
    ports:
    - protocol: TCP
      port: 5432
  # Allow the schema migration Job to update the primary PostgreSQL database.
  - from:
    - podSelector:
        matchLabels:
          app: postgres-schema-migrations
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - podSelector:
        matchLabels:
          app: postgres-exporter
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: plv-annex-campus
      podSelector:
        matchLabels:
          app: postgres-replica-annex
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: plv-pubad-campus
      podSelector:
        matchLabels:
          app: postgres-replica-pubad
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: firewall-annex-dbs
  namespace: plv-annex-campus
spec:
  podSelector:
