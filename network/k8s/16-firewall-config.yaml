  namespace: plv-pubad-campus
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [couchdb-department, couchdb-wallet-department, postgres-replica-pubad]
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: peer-department
    ports:
    - protocol: TCP
      port: 5984
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: plv-fabric
      podSelector:
        matchExpressions:
          - key: app
            operator: In
            values: [fabric-identity-service, ledger-service, client-app, plv-client-app]
