---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: plv-fabric
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 80

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dotnet-auth-to-postgres
  namespace: plv-main-campus
spec:
  podSelector:
    matchLabels:
      app: postgres-primary
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: plv-fabric
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - dotnet-auth-service
                  - dotnet-api-gateway
      ports:
        - protocol: TCP
          port: 5432
