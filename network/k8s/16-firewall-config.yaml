  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: peer-faculty
    ports:
    - protocol: TCP
      port: 5984
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: plv-fabric
      podSelector:
        matchExpressions:
          - key: app
            operator: In
            values: [fabric-identity-service, ledger-service, client-app, plv-client-app]
    ports:
    - protocol: TCP
      port: 5984
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
